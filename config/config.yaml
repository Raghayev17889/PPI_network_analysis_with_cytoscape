# Analysis configuration for the Alzheimer's disease interaction network.
# Every script reads this file; override the path with --config.

disease:
  id: "DOID:10652"            # Disease Ontology ID used by Hetionet
  name: "Alzheimer's disease"

data:
  raw_dir: data/raw
  processed_dir: data/processed

interactome:
  # Ubiquitin-encoding genes: proteomics screens report every ubiquitinated
  # protein as an interaction partner (UBC alone has 8,611), which would make
  # ubiquitin the dominant hub of any network built from this interactome.
  exclude_symbols: ["UBC", "UBB", "UBA52", "RPS27A"]
  largest_component: true

disease_module:
  random_sets: 1000           # degree-matched random gene sets for the LCC test
  min_degree_bin: 100         # proteins per degree bin when sampling

diamond:
  n_genes: 200                # DIAMOnD iterations computed (ranked list is saved)
  network_genes: 50           # top DIAMOnD proteins added to the disease network
  alpha: 1                    # weight of links to seed genes (1 = original DIAMOnD)
  cv_folds: 5                 # cross-validation: recover held-out seed genes

topology:
  hub_quantile: 0.9           # top 10% by degree = hubs
  bottleneck_quantile: 0.9    # top 10% by betweenness = bottlenecks
  random_attacks: 20          # random-removal repeats in the robustness analysis

clustering:
  method: louvain             # louvain | greedy
  resolution: 1.0
  min_cluster_size: 5         # smaller communities are grouped as cluster 0 ("other")
  stability_runs: 20          # Louvain reruns for the adjusted Rand index

enrichment:
  fdr: 0.05                   # Benjamini-Hochberg threshold
  min_set_size: 5
  max_set_size: 500
  label_source: pathway       # collection used for automatic cluster labels

# Short curated names for the Louvain clusters, chosen after reviewing the
# enrichment results (results/tables/cluster_enrichment.tsv). Clusters without
# an entry fall back to their most significant pathway.
cluster_names:
  1: "APP processing & amyloid"
  2: "Apoptosis & neuronal death"
  3: "Translation & protein folding"
  4: "Growth factor & IGF signalling"
  5: "Glutamatergic synapse"

cytoscape:
  base_url: "http://127.0.0.1:1234/v1"   # CyREST endpoint of a running Cytoscape (3.10+)

output:
  results_dir: results
  cytoscape_dir: cytoscape

random_seed: 42
